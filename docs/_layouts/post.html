---
layout: default
lang: en
---
<main class="page">
  <article class="post">
    <p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
    <div class="prose">
      {{ content }}
    </div>
    <p class="back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
  </article>
</main>
