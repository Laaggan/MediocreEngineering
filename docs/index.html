---
layout: default
body_class: home
---
<main class="quotes" id="quotes">
  <p class="eyebrow" aria-hidden="true">Inspirationsmeddelande <span id="quote-number">1</span> / {{ site.data.quotes.size }}</p>
  <blockquote id="quote" class="quote" aria-live="polite">“{{ site.data.quotes[0] }}”</blockquote>
  <div class="controls">
    <button id="next" class="btn-primary" type="button">
      Nästa
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
    </button>
    {% if site.beach_video_id != "" %}
    <button id="waves" class="btn-ghost" type="button" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 7c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 12c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/><path d="M2 17c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/></svg>
      <span>Havsljud</span>
    </button>
    {% endif %}
  </div>
  <p class="hint">Klicka på citatet, eller tryck →</p>
</main>

<div class="sea" aria-hidden="true">
  <svg viewBox="0 0 2400 120" preserveAspectRatio="none">
    <path d="M0 60 Q150 30 300 60 T600 60 T900 60 T1200 60 T1500 60 T1800 60 T2100 60 T2400 60 V120 H0 Z" fill="#17343d"/>
    <path d="M0 85 Q150 65 300 85 T600 85 T900 85 T1200 85 T1500 85 T1800 85 T2100 85 T2400 85 V120 H0 Z" fill="#1d3f48"/>
  </svg>
</div>

{% if site.beach_video_id != "" %}<div id="yt-player" class="yt-hidden" aria-hidden="true"></div>{% endif %}

<script>
  window.QUOTES = {{ site.data.quotes | jsonify }};
  window.BEACH_VIDEO_ID = {{ site.beach_video_id | jsonify }};
</script>
<script src="{{ '/assets/js/quotes.js' | relative_url }}"></script>
