<!DOCTYPE html>
<html>
    <head>
        <style>
            .parent{
                background-color: aqua;
                position: absolute; 
                top: 0; 
                left: 0;
                height: 100%;
                width: 100%;
            }

            .child{
                background-color: rebeccapurple;
                height: 50%;
                width: 50%;
                /* transition: transform 1s ease-in-out; */
                /* transition: 1s; */
            }

            .parent:hover .child{
                /* background-color: green; */
                animation: left-to-right 4s ease-in forwards 3 alternate;
            }

            @keyframes left-to-right {
                0%{
                    transform: translateX(0%);
                }
                33%{
                    transform: translateY(100%);
                }
                66%{
                    transform: translateX(100%) translateY(100%);
                }
                100%{
                    transform: translateX(100%);
                }
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="child">

            </div>
        </div>
    </body>
</html>
